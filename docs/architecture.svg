<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="alexa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0b57d0"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e88b00"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="62" font-size="30" font-weight="700" fill="#0f172a">Home Energy Copilot</text>
  <text x="60" y="90" font-size="16" fill="#5f6368">Self-hosted Alexa+ MCP add-on &#183; MCP revision 2025-11-25 &#183; Streamable HTTP &#183; zero runtime dependencies</text>
  <line x1="60" y1="108" x2="1140" y2="108" stroke="#e3e8ef" stroke-width="1.5"/>

  <!-- Alexa+ service -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="250" height="96" rx="12" fill="url(#alexa)"/>
  </g>
  <text x="185" y="186" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Alexa+ service</text>
  <text x="185" y="210" font-size="13" fill="#d7e6ff" text-anchor="middle">MCP client</text>
  <text x="185" y="230" font-size="12" fill="#c3d9ff" text-anchor="middle">discover &#183; invoke &#183; confirm</text>

  <!-- Arrow to server -->
  <line x1="310" y1="198" x2="420" y2="198" stroke="#5f6368" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="365" y="176" font-size="12.5" fill="#3c4043" text-anchor="middle" font-weight="600">POST /mcp</text>
  <text x="365" y="192" font-size="11.5" fill="#5f6368" text-anchor="middle">JSON-RPC 2.0</text>
  <text x="365" y="222" font-size="11.5" fill="#5f6368" text-anchor="middle">GET (SSE stream)</text>
  <text x="365" y="240" font-size="11.5" fill="#1a73e8" text-anchor="middle" font-weight="600">Mcp-Session-Id</text>

  <!-- Server container -->
  <rect x="420" y="130" width="470" height="470" rx="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="420" y="130" width="470" height="46" rx="16" fill="url(#server)"/>
  <rect x="420" y="158" width="470" height="18" fill="url(#server)"/>
  <text x="655" y="160" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Home Energy Copilot &#8212; self-hosted MCP server</text>

  <!-- Layer 1 -->
  <rect x="444" y="196" width="422" height="74" rx="10" fill="#f2f6fc" stroke="#c9d8ef" stroke-width="1.2"/>
  <text x="460" y="221" font-size="14.5" font-weight="700" fill="#0b57d0">server.py &#8212; transport + lifecycle</text>
  <text x="460" y="241" font-size="11.8" fill="#3c4043">initialize &#183; capability negotiation &#183; session issue / expiry</text>
  <text x="460" y="258" font-size="11.8" fill="#3c4043">Origin &#8594; 403 &#183; Accept &#8594; 406 &#183; SSE response path</text>

  <!-- Layer 2 -->
  <rect x="444" y="282" width="422" height="74" rx="10" fill="#f2f6fc" stroke="#c9d8ef" stroke-width="1.2"/>
  <text x="460" y="307" font-size="14.5" font-weight="700" fill="#0b57d0">registry.py &#8212; tool contracts</text>
  <text x="460" y="327" font-size="11.8" fill="#3c4043">JSON Schema 2020-12 validation on every call</text>
  <text x="460" y="344" font-size="11.8" fill="#3c4043">protocol error vs tool execution error (model self-correction)</text>

  <!-- Layer 3 -->
  <rect x="444" y="368" width="422" height="96" rx="10" fill="#fff8ec" stroke="#ffd699" stroke-width="1.2"/>
  <text x="460" y="393" font-size="14.5" font-weight="700" fill="#a35b00">tools.py &#8212; seven voice-first tools</text>
  <text x="460" y="414" font-size="11.8" fill="#3c4043">read: get_home_status &#183; get_energy_report &#183; find_energy_waste</text>
  <text x="460" y="431" font-size="11.8" fill="#3c4043">read: recommend_energy_actions &#183; list_automations</text>
  <text x="460" y="448" font-size="11.8" fill="#b3261e" font-weight="600">write: set_device_state &#183; apply_energy_plan (propose &#8594; confirm)</text>

  <!-- Layer 4 -->
  <rect x="444" y="476" width="422" height="100" rx="10" fill="#f2f6fc" stroke="#c9d8ef" stroke-width="1.2"/>
  <text x="460" y="501" font-size="14.5" font-weight="700" fill="#0b57d0">store.py &#8212; SQLite state</text>
  <text x="460" y="521" font-size="11.8" fill="#3c4043">devices &#183; rooms &#183; automations &#183; activity</text>
  <text x="460" y="538" font-size="11.8" fill="#3c4043">14 days of hourly energy samples</text>
  <text x="460" y="558" font-size="11.8" fill="#0d652d" font-weight="600">savings are measured, never hard-coded</text>

  <!-- Arrow to response -->
  <line x1="890" y1="198" x2="1000" y2="198" stroke="#5f6368" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="945" y="176" font-size="12.5" fill="#3c4043" text-anchor="middle" font-weight="600">tool result</text>
  <text x="945" y="192" font-size="11.5" fill="#5f6368" text-anchor="middle">speech</text>
  <text x="945" y="208" font-size="11.5" fill="#5f6368" text-anchor="middle">display</text>
  <text x="945" y="224" font-size="11.5" fill="#5f6368" text-anchor="middle">data</text>

  <!-- Right column: contract -->
  <rect x="1000" y="130" width="140" height="150" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"/>
  <text x="1070" y="158" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">One result,</text>
  <text x="1070" y="176" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">three audiences</text>
  <line x1="1016" y1="190" x2="1124" y2="190" stroke="#e3e8ef" stroke-width="1.2"/>
  <text x="1016" y="212" font-size="11.5" fill="#3c4043" font-weight="600">speech</text>
  <text x="1016" y="228" font-size="10.5" fill="#5f6368">spoken, no markup</text>
  <text x="1016" y="248" font-size="11.5" fill="#3c4043" font-weight="600">display</text>
  <text x="1016" y="264" font-size="10.5" fill="#5f6368">readable on screen</text>

  <!-- Bottom band: verification -->
  <rect x="60" y="646" width="1080" height="106" rx="12" fill="#0f172a"/>
  <text x="90" y="680" font-size="15" font-weight="700" fill="#ffffff">Verification &#8212; python tests/smoke_test.py</text>
  <text x="90" y="706" font-size="13" fill="#9fb3c8">Boots the real HTTP server on an ephemeral port and drives the full client sequence:</text>
  <text x="90" y="728" font-size="13" fill="#9fb3c8">initialize &#8594; notifications/initialized &#8594; tools/list &#8594; tools/call</text>
  <g>
    <rect x="742" y="662" width="180" height="72" rx="8" fill="#123524" stroke="#2e7d32" stroke-width="1.4"/>
    <text x="832" y="694" font-size="20" font-weight="700" fill="#6ee7a8" text-anchor="middle">57 checks</text>
    <text x="832" y="718" font-size="14" fill="#a7d7b8" text-anchor="middle">0 failures</text>
  </g>
  <g>
    <rect x="936" y="662" width="180" height="72" rx="8" fill="#1c2b3a" stroke="#3d5a80" stroke-width="1.4"/>
    <text x="1026" y="690" font-size="12.5" fill="#bcd3ea" text-anchor="middle">Origin 403 &#183; Session 404</text>
    <text x="1026" y="712" font-size="12.5" fill="#bcd3ea" text-anchor="middle">tool errors recoverable</text>
  </g>

  <!-- AWS Builder overlay note -->
  <g opacity="0.96">
    <rect x="60" y="268" width="250" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="185" y="298" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">AWS Builder mini-challenge</text>
    <line x1="80" y1="312" x2="290" y2="312" stroke="#e3e8ef" stroke-width="1.2"/>
    <text x="80" y="336" font-size="11.8" fill="#3c4043">Amazon Bedrock</text>
    <text x="80" y="354" font-size="10.8" fill="#5f6368">rephrases speech text only.</text>
    <text x="80" y="370" font-size="10.8" fill="#5f6368">Every digit is verified after</text>
    <text x="80" y="386" font-size="10.8" fill="#5f6368">the call; a mismatch is</text>
    <text x="80" y="402" font-size="10.8" fill="#5f6368">rejected, so a hallucination</text>
    <text x="80" y="418" font-size="10.8" fill="#5f6368">cannot become a wrong bill.</text>
    <text x="80" y="446" font-size="11.8" fill="#3c4043">Amazon ECS Fargate</text>
    <text x="80" y="464" font-size="10.8" fill="#5f6368">runs this container behind</text>
    <text x="80" y="480" font-size="10.8" fill="#5f6368">an ALB with TLS.</text>
    <text x="80" y="508" font-size="11.8" fill="#3c4043">AgentCore &#183; CloudWatch</text>
    <text x="80" y="526" font-size="10.8" fill="#5f6368">session memory and</text>
    <text x="80" y="542" font-size="10.8" fill="#5f6368">tool-level metrics.</text>
  </g>
  <line x1="310" y1="418" x2="420" y2="418" stroke="#1a73e8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="365" y="404" font-size="11" fill="#1a73e8" text-anchor="middle" font-weight="600">optional</text>
  <text x="365" y="438" font-size="11" fill="#1a73e8" text-anchor="middle" font-weight="600">AWS path</text>
</svg>
